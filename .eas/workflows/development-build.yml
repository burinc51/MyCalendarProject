name: Android Dev Build (Standard Yarn)

on:
  workflow_dispatch:

jobs:
  build_android:
    type: build
    params:
      platform: android
      profile: development
    project_archive:
      type: git
    env:
      NODE_VERSION: "22"
      YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
      EXPO_USE_YARN_COREPACK: "1"
    steps:
      - name: Install dependencies
        run: yarn install --inline-builds
      - name: Build Android
        uses: eas/build
